[package]
name = "chipper"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-governor = { version = "0.10.0", default-features = false }
actix-multipart = "0.7"
actix-web = { version = "4", default-features = false, features = ["macros", "cookies", "unicode"] }
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
hc_helper = { git = "https://github.com/breynard0/hc_helper" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
